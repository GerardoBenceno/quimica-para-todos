name: Desplegar en GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Optimizar arte (arte/originales -> assets/images)
        run: npm run art
      - name: Importar plantillas CSV (plantillas/<id> -> packs/<id>)
        run: npx tsx scripts/import-pack-csv.ts
      - name: Validar contenido
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Solo main publica: el entorno github-pages solo acepta la rama por defecto.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
